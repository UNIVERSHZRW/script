<section id="planes"><p class="eyebrow">01 · ELEGIR TU PLAN</p><h2>Dos opciones. Una diferencia concreta.</h2><div class="cards"><article class="card"><span class="eyebrow">SIEMPRE DISPONIBLE</span><h3>Gratis</h3><div class="price">Precio por verificar <small>MXN · sin vencimiento</small></div><p class="card-intro">Para buscar, compartir y resolver tareas individuales con nuestras herramientas.</p><ul class="features"><li>Buscador y contenido gratuito autorizado</li><li>Herramientas individuales: enlaces, QR, imágenes, SEO y metadatos</li><li>Hasta 3 carpetas personales</li><li>Hasta 3 aportaciones en 30 días</li><li>Comunichat y colaboración habilitada</li><li>Participación en actividades gratuitas disponibles</li></ul><div class="card-actions"><a class="action secondary" href="/mi-cuenta">Usar Gratis</a><a class="action secondary" href="/herramientas">Abrir herramientas gratuitas</a></div></article>
<article class="card premium"><span class="badge">ESTUDIO DE CREADORES INCLUIDO</span><h3>Premium</h3><div class="price">Precio por verificar <small>MXN / 30 días</small></div><p class="card-intro">Para quienes publican y preparan contenido regularmente. Una sola sesión de trabajo puede sustituir decenas de tareas manuales.</p><ul class="features"><li>Todo lo disponible en Gratis</li><li>Edición de hasta 20 imágenes juntas con tamaños para redes</li><li>Marca de agua y exportación de todo el lote a un ZIP</li><li>Hasta 50 códigos QR por campaña, con archivo de referencias</li><li>Auditoría de hasta 200 fichas SEO y reporte descargable CSV</li><li>Hasta 100 carpetas personales</li><li>Hasta 100 aportaciones cada 30 días</li><li>Elegibilidad para recompensas verificadas de creadores</li></ul><div class="card-actions"><a class="action" href="/estudio">Ver mi Estudio Premium</a><button type="button" data-tier="premium">Solicitar Premium sin pagar</button></div></article></div><p class="notice" role="status" aria-live="polite" id="notice">El cobro todavía no está habilitado: solicitar Premium registra interés, no realiza un cargo ni activa el plan. Los precios se verifican contra Supabase.</p></section>
<section id="comparar"><p class="eyebrow">02 · COMPARACIÓN</p><h2>¿En qué cambia tu trabajo?</h2><div class="comparison"><table><thead><tr><th>Función</th><th>Gratis</th><th>Premium</th></tr></thead><tbody><tr><td>Optimizar imágenes</td><td>Individual</td><td>Hasta 20 con marca de agua y ZIP</td></tr><tr><td>Generador de QR</td><td>Un código por vez</td><td>Hasta 50 + archivo de campaña</td></tr><tr><td>Revisión SEO editorial</td><td>Una ficha</td><td>Hasta 200 + informe CSV</td></tr><tr><td>Formatos para redes sociales</td><td>Edición manual</td><td>Presets de publicación, historia y miniatura</td></tr><tr><td>Carpetas personales</td><td>3</td><td>100</td></tr><tr><td>Aportaciones cada 30 días</td><td>3</td><td>100</td></tr><tr><td>Elegibilidad para recompensas de creador</td><td>Según reglas de colaboración</td><td>Incluida cuando cumple verificación</td></tr><tr><td>Coins incluidos</td><td>No</td><td>No, se gestionan por separado</td></tr></tbody></table></div></section>
<section id="casos"><p class="eyebrow">03 · CASOS DE USO REALES</p><h2>Para que sigas creando cada mes</h2><div class="examples"><article><strong>Creadores de contenido</strong><p>Convierte portadas en formatos para historia, publicación y video. Aplica tu propia marca y descarga todo agrupado.</p></article><article><strong>Negocios y promociones</strong><p>Prepara QR para catálogos, productos o campañas. Conserva un CSV con la dirección correspondiente a cada imagen.</p></article><article><strong>Bibliotecas y publicaciones</strong><p>Comprueba decenas de títulos y sinopsis en una sola operación y descarga una lista de revisiones pendientes.</p></article></div></section>
<section id="faq"><p class="eyebrow">04 · CONDICIONES CLARAS</p><h2>Lo que necesitas saber</h2><div class="faq"><article><h3>¿Se suben mis archivos?</h3><p>No. Las herramientas del Estudio trabajan directamente en tu navegador. No alojan ni descargan archivos de terceros.</p></article><article><h3>¿Qué pasa si vence Premium?</h3><p>Vuelves a los límites del plan Gratis. Los archivos que hayas descargado permanecen contigo.</p></article><article><h3>¿Incluye Coins o INFT?</h3><p>No. Los créditos internos y el token INFYNITY se administran por separado. Premium no da derechos automáticos de intercambio.</p></article><article><h3>¿Cuándo se cobra?</h3><p>Las solicitudes son sin cargo. Los cobros deberán habilitarse únicamente después de validar la pasarela y la activación de membresías.</p></article></div><p class="notice">En evaluación para una versión posterior: unión y separación de PDF con pdf-lib, reconocimiento OCR local con Tesseract.js, pizarras con Excalidraw y recorte de video local. Estas opciones no forman parte del plan activo ni se cobran todavía.</p></section><footer class="foot">UNIVERSHZRW · DONDE TODO ES POSIBLE · <a href="/estudio">Estudio de Creadores</a> · <a href="/economia/centro">Centro económico</a></footer></main>
