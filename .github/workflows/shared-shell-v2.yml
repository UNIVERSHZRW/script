name: Shared site shell checks
on:
  push:
    paths: ['shared-ui/shell-v2.js', 'shared-ui/shell-v2.css', 'shared-ui/footer-only-v4.js', 'shared-ui/deploy-shell-v2.mjs', '.github/workflows/shared-shell-v2.yml']
  pull_request:
    paths: ['shared-ui/shell-v2.js', 'shared-ui/shell-v2.css', 'shared-ui/footer-only-v4.js', 'shared-ui/deploy-shell-v2.mjs', '.github/workflows/shared-shell-v2.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check shared-ui/shell-v2.js && node --check shared-ui/footer-only-v4.js && node --check shared-ui/deploy-shell-v2.mjs
      - name: Verify essential features
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const js=fs.readFileSync('shared-ui/shell-v2.js','utf8');
          const css=fs.readFileSync('shared-ui/shell-v2.css','utf8');
          const footer=fs.readFileSync('shared-ui/footer-only-v4.js','utf8');
          for(const x of ['aria-expanded','Escape','uhz-pro-footer','uhz-native-head','DOMContentLoaded'])assert(js.includes(x),x);
          for(const x of ['prefers-reduced-motion','data-uhz-theme=dark','max-width:800px'])assert(css.includes(x),x);
          for(const x of ['uhz_header_account_summary','uhz-v3-balances','uhz-v3-mobile-wallet','data-action','details','hu'])if(x!=='hu')assert(js.includes(x),x);
          assert(!js.includes('const group=el(\'div\',\'uhz-v2-group\')'));
          for(const x of ['flex-wrap:nowrap','uhz-v3-more-menu','uhz-v3-userbar','uhz-v3-mobile-links'])assert(css.includes(x),x);
          for(const x of ['uhz-global-site-footer','uhz-v4-col-toggle','uhz-pro-footer','uhz-footer-verification','uhz-v4-trust-note','preferencias-de-cookies'])assert(js.includes(x),x);
          for(const x of ['uhz-global-site-footer','site-foot','uhz-v4-col-toggle','uhz-unified-shell-v2-css'])assert(footer.includes(x),x);
          for(const x of ['uhz-v4-footer-active','uhz-v4-bottom','uhz-v4-col-toggle','@media(max-width:719px)'])assert(css.includes(x),x);
          assert(css.includes('.uhz-v4-col-toggle:not([open]) > .uhz-v4-nav'), 'Closed accordion navigation must be hidden');
          assert(!js.includes('innerHTML='));
          assert(!footer.includes('innerHTML='));
          console.log('Navigation and footer checks passed');
          "
